[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opinion-scraper"
version = "0.0.1"
authors = [
  { name="Your Name", email="you@example.com" },
]
description = "A web scraper for opinion.lawmaking.go.kr"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "click",
    "python-dotenv>=0.21.1",
    "tqdm>=4.67.1",
    "httpx>=0.24.1",
    "google-generativeai>=0.8.6",
    "google-genai>=1.47.0",
    "pypdf>=4.2.0",
]

[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"

[project.scripts]
assmon = "opinion_scraper.cli:main"
backup = "opinion_scraper.backup:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
